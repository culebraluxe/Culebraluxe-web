name: rust-client-cutover-check

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-cutover-main
  cancel-in-progress: true

jobs:
  client-cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # FULL HISTORY: `cargo test --workspace` below includes the manifest history reader, which reads the real
      # `git log` and asserts it found commits touching its scope word. A shallow clone fails it (2026-09-28).
      - name: checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # THE WORKSPACE, NOT JUST `server`. Until 2026-09-20 this job compiled `domain`, `db` and `server` only, so
      # `workflow`, `integrations` and `forge` — the crates that produce the Forge engine and the `re-workflow`
      # binary — were never compiled by any gate. The workspace held 39 compile errors behind a green check,
      # including 23 undefined-behaviour casts and two `include_str!` paths to files that did not exist.
      - name: Rust workspace compile (all targets)
        run: cargo check --workspace --all-targets
      # Yew's browser module is feature-gated. The host workspace check above never
      # compiled it, which let the production WASM build fail after the Rust API was live.

      # THE ALLOWLIST NAMES A MODULE TREE, NOT A FILE (fixed 2026-09-28).
      #
      # `middle/workflow/src/neon.rs` became the directory `middle/workflow/src/neon/` when that file was
      # split under the 800-line rule, and this gate's exemption was a literal file prefix — so the split turned a
      # green step red at `neon/new_id.rs` without one line of SQL moving or changing. The exemption is now one
      # filter per path shape (the `neon.rs` file and the `neon/` directory), so it follows the adapter wherever its
      # parts live, which is what "confined to named persistence adapters" always meant — and a second split cannot
      # redden this step again. Spelled out rather than alternated because these filters are BRE: `(a|b)` is literal
      # text to a plain `grep -v`, which is the trap that made the first version of this fix a no-op.

      # BOTTOM-UP PERSISTENCE GATE: application/domain/runtime crates do not own SQL.
      # SQL is confined to named persistence adapters. Experimental pool benchmarks are excluded because
      # direct pool access is the subject being measured; they are not linked into application/runtime crates.
      # If a new runtime path needs an exception,
      # it must become a repository/store first rather than expanding this list casually.
      # TEST CODE IS OUT OF SCOPE, AND THE SUITE IS TEST CODE (2026-09-30, re-spelled 2026-10-01).
      # `tests/` is the fixture client the arch-boundary suite runs on: it reads and writes canonical rows
      # directly, because asking the rows rather than a DAO is the method — and several of its cases carry SQL
      # as a *planted sample string* inside an `assert!`, which a textual grep cannot tell from a real query.
      # That is exactly how this step reddened: the "violations" it reported from `arch_boundary__008` were the
      # samples that test asserts against, and from `forge_claim__00*` the fixture writes. The boundary this
      # step protects is PRODUCTION code, so the whole suite — which is linked into no production binary — is
      # excluded here. The paths below are spelled from the repository root, which is the workspace root.
      - name: Rust persistence boundary
        run: |
          set -euo pipefail
          violations="$(
            grep -RInE 'sqlx::(query|query_as|query_scalar)|\.pool\(\)' web middle db cli forge tests --include='*.rs' \
              | grep -v '^db/' \
              | grep -v '^middle/workflow/src/neon.rs:' \
              | grep -v '^middle/workflow/src/neon/' \
              | grep -v '^middle/apis/src/boldsign/store.rs:' \
              | grep -v '^tests/' \
              || true
          )"
          if [ -n "$violations" ]; then
            echo "Raw database access escaped the approved Rust persistence boundaries:"
            echo "$violations"
            exit 1
          fi

      - name: Rust UI browser compile
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p ui --features wasm --target wasm32-unknown-unknown
      # THE WHOLE WORKSPACE'S TESTS, not a hand-picked list. `-p model -p db -p web` was the only test step and
      # it is exactly how a failing WhatsApp normalisation test stayed invisible: those three packages never ran it.
      # The check step above already compiled everything, so this run is cheap in CI.
      - name: Rust workspace tests
        run: cargo test --workspace

      # BOTTOM-UP CUTOVER GATE: Forge/workflow must not merely avoid importing legacy by convention.
      # `legacy/` was archived outside the tree on 2026-10-02 (`~/Documents/forge-legacy-ts-archive-2026-10-02`,
      # recorded in `docs/agent/DEAD-TS-DOWNSIZE.md` section 5, railed by `arch_boundary__012`), so the condition
      # this step used to CREATE by moving the directory aside is now the tree's permanent state. The assertion
      # stays: if `legacy/` comes back, this step fails here rather than in a review.
      - name: Forge and workflow run with legacy physically unavailable
        run: |
          test ! -e legacy
          cargo test --manifest-path Cargo.toml -p workflow -p forge --all-targets
          bash -n scripts/agent-worker-once.sh
