name: gates

# ---------------------------------------------------------------------------
# WHY THIS WORKFLOW EXISTS
#
# Every gate in this repository was invoked by hand or by the engine, and on 2026-09-18 the gap was
# measured rather than theorised: three lint errors shipped through two clean QA passes, because the
# engine's static gate runs semgrep, knip and tsc but not eslint. A rule that nobody enforces is a
# rule that is not in force.
#
# This is an INDEPENDENT runner. It does not take the engine's word for what it ran — that is the
# whole point of a second execution path.
#
# SCOPE, STATED HONESTLY: this workflow CHECKS and never SHIPS. It runs the gates an independent
# runner can run, and it deliberately contains NO deploy job — every Vercel build costs money and CI
# deploys were doubling the bill, so production is deployed from the captain's machine with
# `pnpm release` (1-2x per day), which builds, deploys, probes and records a receipt. A red main is
# reported here in about a minute without touching Vercel.
#
# IT REVERSED AN EARLIER DESIGN: ENG-FORGE-CI-PRODUCTION-FENCE-01 added a token-gated deploy job so a
# failing gate could not reach production. That job never ran (no token), but its skip message told the
# next reader how to switch it on — the repository literally carried instructions to restart the cost.
# Deleted 2026-09-18 on the captain's word. What remains of that story's intent is honest and weaker:
# CI reports a red main, and the operator decides to release. Do not re-add a deploy job here; if the
# "a red main cannot reach production" guarantee is wanted back, it belongs in `pnpm release` as a
# REFUSAL (read the CI status for HEAD and stop if it is red) — a read, not a build.
#
# NO SECRETS REQUIRED for the `static` job, so it runs from the first push. The `database` job needs
# dev credentials and stays parked until the repository variable FORGE_DB_CI is set to 'true'.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:
  # A scheduled run is what makes a NEW critical advisory visible without anyone
  # remembering to invoke the scan. GitHub fires schedules on the default branch only.
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

concurrency:
  group: gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: static gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Full history on purpose: the secret scan reads commits, and the migration lint needs a base
      # range to diff against. A shallow checkout would silently scan nothing.
      - name: checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # WHAT WAS REMOVED HERE, AND WHY (2026-09-28).
      #
      # Three steps in this job checked a repository that no longer exists, so they could only ever fail —
      # and a gate that always fails is not a gate, it is a red light people learn to scroll past:
      #
      #   * `pnpm typecheck` — `tsc --noEmit` reports 679 errors, every one of them in the reference-only
      #     dead TypeScript (`agent-runtime/`, `scripts/*.ts` importing the deleted `legacy/`). Those files
      #     are kept on purpose ("marked, not deleted" — docs/agent/BROKEN-TS-INVENTORY.md) and they cannot
      #     typecheck, so this step cannot be green until they are deleted. The live TypeScript is the
      #     remaining TypeScript is tracked by the ratchet; executable tests live in Rust.
      #   * `node scripts/app-runtime-boundary.mjs` — it walks `app/`, which was deleted with the TypeScript
      #     application, so it exits ENOENT. Its boundary (the UI must not import the retired server) is
      #     enforced by `eslint.config.mjs` over `rust/ui`-facing TypeScript now.
      #   * `node --import tsx scripts/forge-static-gate.ts` — its module
      #     `legacy/workflow_app/forge/forge-static-gate` was deleted in the same port; the file carries the
      #     `⚠ BROKEN ON PURPOSE` banner. The Rust-side static checks it stood for are `rust-client-cutover.yml`
      #     (workspace compile, persistence boundary, browser compile, workspace tests), which is their home.
      #
      # The engine's harness gate that DOES exist is the next step, and it is the same command the engine and
      # the captain run, so CI cannot drift from them.

      - name: harness gates (packets, manifests, vendor blocks)
        run: pnpm forge:packet-lint

      # THE HANDBOOK'S GUARD PATHS ARE LINTED, NOT ASSUMED (ENG-GUARD-AGENTS-LINT-01).
      #
      # Every `guard:` line in AGENTS.md is a CLAIM that a test exists, and nothing read those claims: eight
      # `guard: workflow_app/tests/*.test.ts` lines survived the deletion of the whole TypeScript application,
      # so the handbook read as if nine rules were guarded and not one file was there. `forge guard-lint`
      # (`rust/cli/src/forge/guard_paths.rs`) is the blocking half: a path that does not exist, or that exists
      # but holds no test, FAILS with its line number and exits 1. `pnpm forge:packet-lint` above runs the same
      # check but only WARNS, and the `cargo test` assertion in the rust job sits below the format step — so
      # this explicit step is what makes a dead guard path actually stop the pipeline.
      - name: guard paths (every `guard:` in AGENTS.md resolves to a test)
        run: pnpm forge:guard-lint

      - name: lint
        run: pnpm lint

      # THE TYPESCRIPT COUNT — ONE WRITER (owner's order, 2026-09-29).
      #
      # Two gates used to sit here: `ts:count` against `docs/agent/live-ts-baseline.txt` (69 loadable
      # files) and `ts-ratchet` against `docs/agent/ts-allowlist.txt` (all 259 tracked TS/JS outside
      # `legacy/`). Both were green and both had to be edited to retire one file, which is one fact
      # with two writers. The owner kept the ratchet: it is the wider set, its allowlist MAY ONLY
      # SHRINK, and `broken:ts:sweep` still demands the retirement banner from anything that cannot
      # load. The live-TS gate and its baseline were deleted on this order.
      #
      # `broken:ts:sweep` itself MOVED to the `rust` job on 2026-09-29, when the port deleted the last
      # Node script in the repository and the gate became a `forge` subcommand: this job has pnpm and
      # node but no toolchain and no cargo cache, and compiling `cli` here would cost the whole timeout.
      - name: TS/JS ratchet (allowlist may only shrink)
        run: bash scripts/ts-ratchet.sh

      # THE APP SUITE, AND THE REASON IT IS NEW HERE (Astra review, 2026-09-18).
      #
      # This step did not exist, and its absence is why four High defects — a secret scan that read only
      # the tip commit, migration results dropped on the way to QA, a skipped test satisfying acceptance —
      # sat under a green pipeline. `workflow_app/tests/*.test.ts` is now the DB-FREE glob its own
      # documentation always claimed it was: the two files that need the control plane moved to
      # `workflow_app/tests/db/` (see `pnpm test:app:db`, on demand, with `.env.local`). Before that, the
      # glob included them, so the suite could never be green without a database — which is how a suite
      # gets switched off instead of fixed.
      #
      # It also had to be FIXED, not merely wired: three tests were genuinely stale (a test double whose
      # parameter map had drifted from the finish statement's three run-updates, and a shape guard whose
      # test predated the splitAssignment/parallelSize requirement). Wiring a red suite is how a gate
      # becomes something people scroll past.
      - name: app fences (no database)
        run: pnpm test:app

      # squawk-cli via npm, the same install and version verified against this repository locally.
      - name: migrations — squawk over changed files
        env:
          # On a pull request the base is the target branch; on a push it is the previous head, so
          # the range is exactly what this event introduced. If neither resolves, the script says so
          # instead of silently linting nothing.
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          npm install -g squawk-cli@2.65.0
          pnpm scan:migrations

      # PINNED BINARIES, NOT MARKETPLACE ACTIONS — and that is a deliberate reversal. The first
      # version of this file used `google/osv-scanner-action@v2`, which does not exist (the tags are
      # patch-level: v2.6.0, v2.5.1, …) and failed the first real run in five seconds. Reading the
      # action's own description settled it: "not intended to be used directly … the scanner action
      # behavior might change in a minor patch update". A gate whose behaviour can shift underneath a
      # green run cannot be reproduced, so these steps download the exact versions verified locally on
      # 2026-09-18 and check the published checksum before running them.
      - name: secrets — gitleaks over history
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl -sSfL "$base/gitleaks_8.30.1_linux_x64.tar.gz" -o /tmp/gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSfL "$base/gitleaks_8.30.1_checksums.txt" -o /tmp/gitleaks.sums
          (cd /tmp && grep 'gitleaks_8.30.1_linux_x64.tar.gz' gitleaks.sums | sha256sum -c -)
          tar -xzf /tmp/gitleaks_8.30.1_linux_x64.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
          pnpm scan:secrets

      - name: dependencies — osv-scanner
        # A real gate, not an advisory. Every advisory osv-scanner reports must have a triage row in
        # docs/agent/DEPENDENCY-TRIAGE.md, keyed on package@version plus advisory id. The step is
        # green while every reported advisory is triaged and red the moment one is not, so a new
        # advisory is visible without anyone remembering to run the scan. The ledger is the single
        # writer of the triage fact; this step only reads it. ENG-FORGE-DEPENDENCY-AUDIT-01.
        run: |
          base=https://github.com/google/osv-scanner/releases/download/v2.6.0
          curl -sSfL "$base/osv-scanner_linux_amd64" -o /tmp/osv-scanner_linux_amd64
          curl -sSfL "$base/osv-scanner_SHA256SUMS" -o /tmp/osv-scanner.sums
          (cd /tmp && grep 'osv-scanner_linux_amd64' osv-scanner.sums | sha256sum -c -)
          install -m 0755 /tmp/osv-scanner_linux_amd64 /usr/local/bin/osv-scanner
          osv-scanner --version
          # The human-readable report. Its non-zero exit while advisories exist is expected; the
          # triage check below, not this exit code, decides whether the step passes.
          pnpm scan:deps || true
          osv-scanner scan source -L pnpm-lock.yaml --all-packages --format json > /tmp/osv.json || true
          cat > /tmp/triage-gate.mjs <<'NODE'
          import { readFileSync } from 'node:fs'
          const scan = JSON.parse(readFileSync('/tmp/osv.json', 'utf8'))
          const reported = new Set()
          for (const result of scan.results ?? []) {
            for (const pkg of result.packages ?? []) {
              const name = pkg.package?.name
              const version = pkg.package?.version
              for (const vuln of pkg.vulnerabilities ?? []) reported.add(`${name}@${version}|${vuln.id}`)
            }
          }
          const ledger = new Map()
          for (const line of readFileSync('docs/agent/DEPENDENCY-TRIAGE.md', 'utf8').split('\n')) {
            if (!line.trim().startsWith('|')) continue
            const cells = line.split('|').map((cell) => cell.trim())
            if (!/^GHSA-[a-z0-9-]+$/i.test(cells[3] ?? '')) continue
            ledger.set(`${cells[1]}@${cells[2]}|${cells[3]}`, {
              severity: cells[4] ?? '',
              classification: cells[5] ?? '',
              reason: cells[6] ?? '',
            })
          }
          const untriaged = [...reported].filter((key) => !ledger.has(key))
          console.log(`osv-scanner reported ${reported.size} advisories; ${reported.size - untriaged.length} triaged`)
          if (untriaged.length > 0) {
            console.error('UNTRIAGED ADVISORIES:')
            for (const key of untriaged) console.error(`  ${key}`)
            process.exit(1)
          }

          // A CRITICAL THAT WE BELIEVE IS REACHABLE FAILS THE BUILD.
          //
          // The ledger's own vocabulary distinguishes "can execute while serving a production request" from
          // "cannot run here". A row that says the first thing about a CRITICAL advisory is a statement that the
          // product is exposed, and a green pipeline must not be able to make that statement quietly — it has to
          // be fixed (upgrade or remove the dependency) or re-triaged with a reason. Added 2026-09-28, when the two
          // Next.js criticals were found recorded as "reachable-in-production" long after that stopped being true.
          const KNOWN = new Set(['reachable-in-production', 'dev-only', 'not-reachable', 'retired-unused'])
          const bad = []
          for (const [key, row] of ledger) {
            if (!reported.has(key)) continue
            if (!KNOWN.has(row.classification)) {
              bad.push(`${key}: unknown classification "${row.classification}"`)
              continue
            }
            if (/^critical$/i.test(row.severity) && row.classification === 'reachable-in-production') {
              bad.push(`${key}: CRITICAL and reachable in production — fix it or re-triage with a reason`)
            }
          }
          if (bad.length > 0) {
            console.error('CRITICAL REACHABLE ADVISORIES:')
            for (const line of bad) console.error(`  ${line}`)
            process.exit(1)
          }
          console.log('no critical advisory is recorded as reachable in production')
          NODE
          node /tmp/triage-gate.mjs

  # ---------------------------------------------------------------------------
  # THE DEPLOY IS THE PROTECTED BOUNDARY (ENG-FORGE-CI-PRODUCTION-FENCE-01).
  #
  # Until this job, the workflow was an ALERT: Vercel deploys main on push, so a commit that failed
  # these gates was already serving by the time the check reported. This job makes the deploy WAIT for
  # the gates — main only, only after `static` passes, and it is the only thing here that builds and
  # deploys production.
  #
  # ONE CONSOLE STEP REMAINS AND CANNOT BE A COMMIT: Vercel's own automatic production deployment for
  # main must be turned OFF, or Vercel keeps deploying in parallel and this fence protects nothing.
  # When the token secret is absent the job says so in the run summary, so the gap stays VISIBLE
  # instead of being assumed closed — a fence that quietly does nothing is worse than no fence.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # THERE IS NO DEPLOY JOB HERE, AND THAT IS DELIBERATE — DO NOT ADD ONE.
  #
  # The captain, 2026-09-18: "we do not want CI for vercel i purposely broke that it was
  # doubling my bill." Every build this workflow triggers on Vercel is billed, and a job that
  # built on every push to main turned one or two releases a day into ~30 builds. The deploy is
  # LOCAL BY DESIGN and the rhythm is the point of it: ~30 stories, then ONE build and ONE deploy
  # (`pnpm release`, about five minutes) — simple on purpose.
  #
  # A deploy job used to sit here (ENG-FORGE-CI-PRODUCTION-FENCE-01). It was token-gated and
  # therefore inert, but its skip message told the NEXT reader to add a VERCEL_TOKEN secret to
  # activate it — i.e. the repository contained written instructions to restart the cost, and
  # that is worse than no fence at all. It is deleted, not parked.
  #
  # SO: this workflow CHECKS, and never ships. A red main is reported here in about a minute
  # without a single Vercel build. The release path is `pnpm release`, which builds, deploys,
  # probes and records a receipt; the FORGE CHAIN NEVER BUILDS AND NEVER DEPLOYS.
  # ---------------------------------------------------------------------------


  rust:
    name: rust core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      # FULL HISTORY, for the same reason the static job has it — and this one is not about the secret scan.
      # `cli/src/forge/manifest.rs`'s `the_history_reader_answers_three_questions_in_one_pass` reads the real
      # `git log` for commits that touched a scope word and asserts it found at least one. On a shallow clone
      # (the default, one commit) that assertion fails, which is exactly what happened the first time this job
      # reached `cargo test` on 2026-09-28 — the step had been unreachable since the job was written. The reader
      # degrades to "no history" only when git is ABSENT, not when it is shallow, and loosening the test to pass
      # on a shallow clone would make it silent in CI forever.
      - name: checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: rust toolchain
        run: |
          rustc --version
          cargo --version
          rustfmt --version
          rustup target add wasm32-unknown-unknown

      # Cache ~/.cargo (registry + git) and rust/target. The toolchain comes from the runner image, the
      # dependency build is the expensive part, and that is what this keeps warm.
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: gates-rust

      - name: rust compile
        working-directory: rust
        run: cargo check --workspace --all-targets

      # THE TREE WAS NOT FORMATTED, AND THAT IS WHY THIS JOB PROVED NOTHING (fixed 2026-09-28).
      #
      # `cargo fmt --check` had been failing on every push for as long as the job existed — the tree held 915
      # rustfmt hunks across 214 files — and because a failed step ends the job, the two steps BELOW it, `cargo
      # test` above all, had never executed once. The job looked like "CI compiles and tests the Rust" and was
      # really "CI reports that rustfmt would change something". A red step early in a job hides every step
      # after it; that is the whole failure mode, and it is worth remembering when adding a step here.
      #
      # `cargo fmt --all` brought 202 files to canonical form. Four module trees are DEFERRED, not forgotten:
      # they belong to the engine agent working in them right now, and formatting them would collide with live
      # edits for no behavioural gain. The exemption is a named, dated list and everything else is enforced.
      - name: rust format
        working-directory: rust
        run: |
          set -euo pipefail
          # TEMP PR diagnostic: print rustfmt's exact patch so this branch can be formatted without touching
          # unrelated concurrent files. Removed before merge.
          cargo fmt --all -- --check

      - name: install cargo-nextest
        if: ${{ !cancelled() }}
        uses: taiki-e/install-action@nextest

      - name: rust tests
        if: ${{ !cancelled() }}
        working-directory: rust
        run: cargo nextest run --workspace --profile ci

      - name: CulebraLuxe Rust test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: CulebraLuxe Rust Tests
          path: rust/target/nextest/ci/junit.xml
          reporter: java-junit
          fail-on-empty: 'false'

      # The browser surface is feature-gated, so the host check above never compiles it. This is the crate the
      # deploy actually ships; a green workspace check does not imply it builds (2026-09-28, commit 305026d7).
      - name: rust browser compile (what the deploy ships)
        working-directory: rust
        run: cargo check -p ui --features wasm --target wasm32-unknown-unknown --all-targets

      # WARNINGS ARE ERRORS, FOR EVERY CRATE THAT DOES NOT DEPEND ON THE ENGINE.
      #
      # `forge` is excluded because its eight warnings belong to the agent working in it, and so are `server` and
      # `cli`, which link `forge` and would therefore fail on its warnings rather than their own — `RUSTFLAGS`
      # applies to every crate being compiled, dependencies included. The six named here are the ones this
      # repository can hold to zero today: they are, verified locally, warning-free.
      - name: rust warnings are errors (every crate except the engine)
        working-directory: rust
        run: RUSTFLAGS="-D warnings" cargo check -p ui -p db -p integrations -p domain -p service -p workflow --all-targets

      # THE RUST DEPENDENCY SCAN. osv-scanner reads `pnpm-lock.yaml` and says nothing about the 364 crates in
      # `rust/Cargo.lock`, which are the ones that actually run in production. `cargo audit` closes that: at the
      # commit this was added it reported ZERO vulnerabilities and three unmaintained-crate warnings (bincode,
      # proc-macro-error, smartstring — all transitive, none reachable from our code), and an unmaintained
      # warning is exactly the kind of thing worth seeing on a schedule rather than never.
      - name: rust dependency audit
        working-directory: rust
        run: |
          cargo install --locked cargo-audit --version 0.22.2
          cargo audit --file Cargo.lock

      # 2026-09-28 (applemail, apple_messages, apple_mail, forge/lint) and two more — the timeline header and
      # accounting_opps — were trimmed the same day when this step first ran and listed them at 811 and 809.
      # Nothing else stopped the next file from growing; this is the thing that stops it.
      #
      # TWO EXEMPTIONS, BOTH EXPLICIT:
      #  * the four engine-owned module trees, deferred with the format step above;
      #  * a file whose header says GENERATED, because a generated data table's length is its content's, not its
      #    author's — `core/domain/src/forms_font_metrics.rs` is 4568 lines of AFM numbers generated from
      #    `@pdf-lib/standard-fonts` so that Rust wraps text where pdf-lib wrapped it. Splitting it by hand would
      #    change pagination, which is what the signature anchors are computed from. A marker, not a file list:
      #    the next generated table is covered without anyone remembering to add it here.
      - name: rust file boundedness (800-line rule)
        run: |
          set -euo pipefail
          deferred='rust/cli/src/apple_mail(\.rs|/)|rust/cli/src/forge/lint(\.rs|/)|rust/core/domain/src/applemail(\.rs|/)|rust/core/domain/src/apple_messages(\.rs|/)'
          listed="$(find rust -path rust/target -prune -o -name '*.rs' -print \
            | xargs wc -l \
            | awk '$1 > 800 && $2 != "total"' \
            | grep -Ev "$deferred" || true)"
          over=""
          while read -r lines file; do
            [ -n "$file" ] || continue
            if head -n 12 "$file" | grep -q 'GENERATED'; then
              echo "(generated, not counted) $lines $file"
              continue
            fi
            over="${over}${lines} ${file}"$'\n'
          done <<< "$listed"
          if [ -n "$over" ]; then
            printf '%s' "$over"
            echo "the files above are over 800 lines: split them (move-only) or say why in the pull request"
            exit 1
          fi
          echo "no .rs file over 800 lines outside the four deferred module trees and generated tables"

      # THE DEAD-TYPESCRIPT LEDGER, RUST AND HERE (moved out of the `static` job, 2026-09-29).
      #
      # Both gates were Node scripts until the port deleted the last Node runtime in this repository:
      # they are `forge` subcommands now (`rust/cli/src/forge/{ts_sweep,dead_commands}.rs`), so they
      # run in the job that has cargo and a warm cache. `pnpm broken:ts:sweep` and
      # `pnpm broken:ts:commands` still exist and call exactly these two commands. The menu gate is the
      # one that can refuse: a new dead command is a finding, and the count may only fall.
      - name: dead-TS ledger (which files cannot load)
        working-directory: rust
        run: cargo run -p cli -- forge ts-sweep

      - name: dead-TS ledger (the pnpm menu, baseline enforced)
        working-directory: rust
        run: cargo run -p cli -- forge dead-commands --check


  rust_database:
    name: rust DEV DB smoke
    # Read-only Rust -> SQLx -> Neon proof. Parked until DATABASE_URL_DEV exists
    # as a GitHub Actions secret and RUST_DB_CI is explicitly enabled.
    if: ${{ vars.RUST_DB_CI == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: dev
      DATABASE_URL_DEV: ${{ secrets.DATABASE_URL_DEV }}
    steps:
      - uses: actions/checkout@v4

      - name: rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Rust -> SQLx -> Neon DEV -> ProjectService
        working-directory: rust
        run: cargo run -p cli -- db-smoke

      - name: Rust transaction + service rollback proof
        working-directory: rust
        run: cargo run -p cli -- tx-smoke

      - name: Rust external ServiceHarness lifecycle proof
        working-directory: rust
        run: cargo test -p server --test service_harness_dev -- --ignored --test-threads=1

      - name: Rust durable command runtime proofs
        working-directory: rust
        run: cargo test -p server --test command_runtime_dev -- --ignored --test-threads=1

      - name: Rust service mutation and outbox atomicity proofs
        working-directory: rust
        run: cargo test -p server --test service_atomicity_dev -- --ignored --test-threads=1

      - name: Rust MQ delivery runtime proofs
        working-directory: rust
        run: cargo test -p server --test mq_runtime_dev -- --ignored --test-threads=1

  rust_dev_server:
    name: rust DEV server boot + query
    # THE GATE THAT WOULD HAVE CAUGHT THE 2-HOUR OUTAGE (2026-09-28). Production went down in the
    # pool's CONNECT path, so every request failed while `cargo test`, `cargo check` and even the CLI's
    # `db-smoke` — which builds its own pool and never boots the server — all stayed green. The thing
    # that serves production is `server --bin http`, so `scripts/rust-dev-boot-smoke.sh` boots exactly
    # that against DEV, waits for `/readyz` (`state.db().ping()`, one real query on the process's own
    # shared pool), REFUSES anything that did not resolve `database_target=dev`, and then makes one
    # domain read (`/api/rust-ui/public-page?screen=site-buyers`, the published listings).
    # READ-ONLY and ONE secret (DATABASE_URL_DEV).
    #
    # PARKED, VISIBLY: it needs DATABASE_URL_DEV as a repository secret and RUST_DB_CI set to 'true' —
    # the same two knobs the two jobs below it wait on. A skipped gate is honest; a job that runs with
    # no credentials and quietly passes is the failure this repository already recorded. To arm it:
    #   gh secret set DATABASE_URL_DEV --body "<the DEV Neon URL>"   (or paste in the UI)
    #   gh variable set RUST_DB_CI --body true
    if: ${{ vars.RUST_DB_CI == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: dev
      DATABASE_URL_DEV: ${{ secrets.DATABASE_URL_DEV }}
    steps:
      - uses: actions/checkout@v4

      - name: rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: boot the server against DEV and query through it
        run: bash scripts/rust-dev-boot-smoke.sh

  database:
    name: database-backed gates
    # Parked until dev credentials exist as secrets. A skipped gate is visibly skipped; a gate that
    # silently passes because it had no credentials is the failure mode this repository already
    # recorded ("a script that cannot run is not a gate").
    if: ${{ vars.FORGE_DB_CI == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: dev
      DATABASE_URL: ${{ secrets.DATABASE_URL_DEV }}
      DATABASE_URL_DEV: ${{ secrets.DATABASE_URL_DEV }}
      DATABASE_URL_PROD: ${{ secrets.DATABASE_URL_PROD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # db:parity is `cargo run -p cli -- db-tool parity` since the TypeScript gate scripts were
      # deleted, so this job needs a working Rust toolchain the same way the `rust` job does.
      - name: rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: schema parity (dev vs prod)
        run: pnpm db:parity

      - name: application and forge-engine suites
        run: pnpm test:app

      - name: rust database/service smoke
        working-directory: rust
        run: cargo run -p cli -- db-smoke
