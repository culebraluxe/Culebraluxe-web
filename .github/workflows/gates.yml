name: gates

# ---------------------------------------------------------------------------
# WHY THIS WORKFLOW EXISTS
#
# Every gate in this repository was invoked by hand or by the engine, and on 2026-09-18 the gap was
# measured rather than theorised: three lint errors shipped through two clean QA passes, because the
# engine's static gate runs semgrep, knip and tsc but not eslint. A rule that nobody enforces is a
# rule that is not in force.
#
# This is an INDEPENDENT runner. It does not take the engine's word for what it ran — that is the
# whole point of a second execution path.
#
# SCOPE, STATED HONESTLY: this workflow CHECKS and never SHIPS. It runs the gates an independent
# runner can run, and it deliberately contains NO deploy job — every Vercel build costs money and CI
# deploys were doubling the bill, so production is deployed from the captain's machine with
# `pnpm release` (1-2x per day), which builds, deploys, probes and records a receipt. A red main is
# reported here in about a minute without touching Vercel.
#
# IT REVERSED AN EARLIER DESIGN: ENG-FORGE-CI-PRODUCTION-FENCE-01 added a token-gated deploy job so a
# failing gate could not reach production. That job never ran (no token), but its skip message told the
# next reader how to switch it on — the repository literally carried instructions to restart the cost.
# Deleted 2026-09-18 on the captain's word. What remains of that story's intent is honest and weaker:
# CI reports a red main, and the operator decides to release. Do not re-add a deploy job here; if the
# "a red main cannot reach production" guarantee is wanted back, it belongs in `pnpm release` as a
# REFUSAL (read the CI status for HEAD and stop if it is red) — a read, not a build.
#
# NO SECRETS REQUIRED for the `static` job, so it runs from the first push. The `database` job needs
# dev credentials and stays parked until the repository variable FORGE_DB_CI is set to 'true'.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:
  # A scheduled run is what makes a NEW critical advisory visible without anyone
  # remembering to invoke the scan. GitHub fires schedules on the default branch only.
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

concurrency:
  group: gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

permissions:
  contents: write

jobs:
  static:
    name: static gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Full history on purpose: the secret scan reads commits, and the migration lint needs a base
      # range to diff against. A shallow checkout would silently scan nothing.
      - name: checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: lint
        run: pnpm lint

      # The engine's own gate, called directly — same instrument, same roots, same exit code. Using
      # the script rather than re-typing the commands is what keeps CI and the engine from drifting.
      - name: architecture, security patterns, dead code
        run: node --import tsx scripts/forge-static-gate.ts

      - name: harness tests (no database)
        run: pnpm test:harness

      # THE APP SUITE, AND THE REASON IT IS NEW HERE (Astra review, 2026-09-18).
      #
      # This step did not exist, and its absence is why four High defects — a secret scan that read only
      # the tip commit, migration results dropped on the way to QA, a skipped test satisfying acceptance —
      # sat under a green pipeline. `workflow_app/tests/*.test.ts` is now the DB-FREE glob its own
      # documentation always claimed it was: the two files that need the control plane moved to
      # `workflow_app/tests/db/` (see `pnpm test:app:db`, on demand, with `.env.local`). Before that, the
      # glob included them, so the suite could never be green without a database — which is how a suite
      # gets switched off instead of fixed.
      #
      # It also had to be FIXED, not merely wired: three tests were genuinely stale (a test double whose
      # parameter map had drifted from the finish statement's three run-updates, and a shape guard whose
      # test predated the splitAssignment/parallelSize requirement). Wiring a red suite is how a gate
      # becomes something people scroll past.
      - name: app fences (no database)
        run: pnpm test:app

      # squawk-cli via npm, the same install and version verified against this repository locally.
      - name: migrations — squawk over changed files
        env:
          # On a pull request the base is the target branch; on a push it is the previous head, so
          # the range is exactly what this event introduced. If neither resolves, the script says so
          # instead of silently linting nothing.
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          npm install -g squawk-cli@2.65.0
          pnpm scan:migrations

      # PINNED BINARIES, NOT MARKETPLACE ACTIONS — and that is a deliberate reversal. The first
      # version of this file used `google/osv-scanner-action@v2`, which does not exist (the tags are
      # patch-level: v2.6.0, v2.5.1, …) and failed the first real run in five seconds. Reading the
      # action's own description settled it: "not intended to be used directly … the scanner action
      # behavior might change in a minor patch update". A gate whose behaviour can shift underneath a
      # green run cannot be reproduced, so these steps download the exact versions verified locally on
      # 2026-09-18 and check the published checksum before running them.
      - name: secrets — gitleaks over history
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl -sSfL "$base/gitleaks_8.30.1_linux_x64.tar.gz" -o /tmp/gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSfL "$base/gitleaks_8.30.1_checksums.txt" -o /tmp/gitleaks.sums
          (cd /tmp && grep 'gitleaks_8.30.1_linux_x64.tar.gz' gitleaks.sums | sha256sum -c -)
          tar -xzf /tmp/gitleaks_8.30.1_linux_x64.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
          pnpm scan:secrets

      - name: dependencies — osv-scanner
        # A real gate, not an advisory. Every advisory osv-scanner reports must have a triage row in
        # docs/agent/DEPENDENCY-TRIAGE.md, keyed on package@version plus advisory id. The step is
        # green while every reported advisory is triaged and red the moment one is not, so a new
        # advisory is visible without anyone remembering to run the scan. The ledger is the single
        # writer of the triage fact; this step only reads it. ENG-FORGE-DEPENDENCY-AUDIT-01.
        run: |
          base=https://github.com/google/osv-scanner/releases/download/v2.6.0
          curl -sSfL "$base/osv-scanner_linux_amd64" -o /tmp/osv-scanner_linux_amd64
          curl -sSfL "$base/osv-scanner_SHA256SUMS" -o /tmp/osv-scanner.sums
          (cd /tmp && grep 'osv-scanner_linux_amd64' osv-scanner.sums | sha256sum -c -)
          install -m 0755 /tmp/osv-scanner_linux_amd64 /usr/local/bin/osv-scanner
          osv-scanner --version
          # The human-readable report. Its non-zero exit while advisories exist is expected; the
          # triage check below, not this exit code, decides whether the step passes.
          pnpm scan:deps || true
          osv-scanner scan source -L pnpm-lock.yaml --all-packages --format json > /tmp/osv.json || true
          cat > /tmp/triage-gate.mjs <<'NODE'
          import { readFileSync } from 'node:fs'
          const scan = JSON.parse(readFileSync('/tmp/osv.json', 'utf8'))
          const reported = new Set()
          for (const result of scan.results ?? []) {
            for (const pkg of result.packages ?? []) {
              const name = pkg.package?.name
              const version = pkg.package?.version
              for (const vuln of pkg.vulnerabilities ?? []) reported.add(`${name}@${version}|${vuln.id}`)
            }
          }
          const ledger = new Set()
          for (const line of readFileSync('docs/agent/DEPENDENCY-TRIAGE.md', 'utf8').split('\n')) {
            if (!line.trim().startsWith('|')) continue
            const cells = line.split('|').map((cell) => cell.trim())
            if (!/^GHSA-[a-z0-9-]+$/i.test(cells[3] ?? '')) continue
            ledger.add(`${cells[1]}@${cells[2]}|${cells[3]}`)
          }
          const untriaged = [...reported].filter((key) => !ledger.has(key))
          console.log(`osv-scanner reported ${reported.size} advisories; ${reported.size - untriaged.length} triaged`)
          if (untriaged.length > 0) {
            console.error('UNTRIAGED ADVISORIES:')
            for (const key of untriaged) console.error(`  ${key}`)
            process.exit(1)
          }
          NODE
          node /tmp/triage-gate.mjs

  # ---------------------------------------------------------------------------
  # THE DEPLOY IS THE PROTECTED BOUNDARY (ENG-FORGE-CI-PRODUCTION-FENCE-01).
  #
  # Until this job, the workflow was an ALERT: Vercel deploys main on push, so a commit that failed
  # these gates was already serving by the time the check reported. This job makes the deploy WAIT for
  # the gates — main only, only after `static` passes, and it is the only thing here that builds and
  # deploys production.
  #
  # ONE CONSOLE STEP REMAINS AND CANNOT BE A COMMIT: Vercel's own automatic production deployment for
  # main must be turned OFF, or Vercel keeps deploying in parallel and this fence protects nothing.
  # When the token secret is absent the job says so in the run summary, so the gap stays VISIBLE
  # instead of being assumed closed — a fence that quietly does nothing is worse than no fence.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # THERE IS NO DEPLOY JOB HERE, AND THAT IS DELIBERATE — DO NOT ADD ONE.
  #
  # The captain, 2026-09-18: "we do not want CI for vercel i purposely broke that it was
  # doubling my bill." Every build this workflow triggers on Vercel is billed, and a job that
  # built on every push to main turned one or two releases a day into ~30 builds. The deploy is
  # LOCAL BY DESIGN and the rhythm is the point of it: ~30 stories, then ONE build and ONE deploy
  # (`pnpm release`, about five minutes) — simple on purpose.
  #
  # A deploy job used to sit here (ENG-FORGE-CI-PRODUCTION-FENCE-01). It was token-gated and
  # therefore inert, but its skip message told the NEXT reader to add a VERCEL_TOKEN secret to
  # activate it — i.e. the repository contained written instructions to restart the cost, and
  # that is worse than no fence at all. It is deleted, not parked.
  #
  # SO: this workflow CHECKS, and never ships. A red main is reported here in about a minute
  # without a single Vercel build. The release path is `pnpm release`, which builds, deploys,
  # probes and records a receipt; the FORGE CHAIN NEVER BUILDS AND NEVER DEPLOYS.
  # ---------------------------------------------------------------------------


  rust:
    name: rust core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: rust toolchain
        run: |
          rustc --version
          cargo --version
          rustfmt --version

      - name: rust format
        working-directory: rust
        run: cargo fmt --all

      - name: commit canonical rustfmt output
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        run: |
          if git diff --quiet -- rust; then
            echo "rustfmt produced no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust
          git commit -m "style(rust): apply canonical rustfmt"
          git push origin HEAD:main

      - name: rust tests
        working-directory: rust
        run: cargo test --workspace --all-targets

      - name: rust compile
        working-directory: rust
        run: cargo check --workspace --all-targets


  rust_database:
    name: rust DEV DB smoke
    # Read-only Rust -> SQLx -> Neon proof. Parked until DATABASE_URL_DEV exists
    # as a GitHub Actions secret and RUST_DB_CI is explicitly enabled.
    if: ${{ vars.RUST_DB_CI == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: dev
      DATABASE_URL_DEV: ${{ secrets.DATABASE_URL_DEV }}
    steps:
      - uses: actions/checkout@v4

      - name: rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Rust -> SQLx -> Neon DEV -> ProjectService
        working-directory: rust
        run: cargo run -p cli -- db-smoke

      - name: Rust transaction + service rollback proof
        working-directory: rust
        run: cargo run -p cli -- tx-smoke

  database:
    name: database-backed gates
    # Parked until dev credentials exist as secrets. A skipped gate is visibly skipped; a gate that
    # silently passes because it had no credentials is the failure mode this repository already
    # recorded ("a script that cannot run is not a gate").
    if: ${{ vars.FORGE_DB_CI == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: dev
      DATABASE_URL: ${{ secrets.DATABASE_URL_DEV }}
      DATABASE_URL_DEV: ${{ secrets.DATABASE_URL_DEV }}
      DATABASE_URL_PROD: ${{ secrets.DATABASE_URL_PROD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: schema parity (dev vs prod)
        run: pnpm db:parity

      - name: application and forge-engine suites
        run: pnpm test:app

      - name: rust database/service smoke
        working-directory: rust
        run: cargo run -p cli -- db-smoke
