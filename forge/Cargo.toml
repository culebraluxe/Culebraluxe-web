[package]
name = "forge"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "forge"
path = "src/bin/forge.rs"

[dependencies]
async-trait.workspace = true
model = { path = "../middle/model" }
sqlx.workspace = true
db = { path = "../db" }
workflow = { path = "../middle/workflow" }
apis = { path = "../middle/apis" }
services = { path = "../middle/services" }
tokio.workspace = true
serde_json.workspace = true
serde.workspace = true
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
wait-timeout = "0.2"
chrono.workspace = true
tracing.workspace = true
reqwest.workspace = true
uuid = { workspace = true, features = ["v4"] }
sha2.workspace = true

[dev-dependencies]
proptest = { workspace = true }
tempfile.workspace = true

[[bin]]
name = "re-workflow"
path = "src/bin/re_workflow.rs"

[[bin]]
name = "forge-task"
path = "src/bin/forge_task.rs"

[[bin]]
name = "forge-worker"
path = "src/bin/forge_worker.rs"

[[bin]]
name = "forge-assay-plan-hash"
path = "src/bin/forge_assay_plan_hash.rs"
