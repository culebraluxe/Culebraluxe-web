[package]
name = "ui"
version = "0.1.0"
edition = "2021"
publish = false

# The MVI core (`model`, `update`, `view`) has no browser dependencies at all — it compiles and its tests run on the
# ordinary host target, which is the point: the interaction model is testable without a browser, a DOM or a WASM
# toolchain. `wasm-bindgen` and `web-sys` arrive only with the `wasm` feature, used by `shell` for the mount and the
# click bridge.
#
# The shell deliberately does NOT depend on `wasm-bindgen-futures` or `reqwest`: the browser never calls the Rust
# API directly. The TypeScript host owns the network (it holds the session and the server-side credentials), fetches
# from the application's own routes, and hands the result to `rows_loaded` as JSON. One bridge, one direction, no
# credentials in the WASM module.
[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "CustomEvent",
    "CustomEventInit",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "MouseEvent",
    "Location",
    "NodeList",
    "Window",
] }
yew = { version = "0.23.0", features = ["csr"], optional = true }
yew-router = { version = "0.20.0", optional = true }
gloo-net = { version = "0.5.0", default-features = false, features = ["http", "json"], optional = true }
patternfly-yew = { version = "0.8", default-features = false, optional = true }
rs-grid-yew = { version = "0.2.5", optional = true }
rs-grid-core = { version = "0.2.4", optional = true }
charming = { version = "0.6", features = ["wasm"], optional = true }
yew-hooks = { version = "0.6.4", optional = true }
yew_icons = { version = "0.10", features = ["lucide"], optional = true }
hadrone-yew = { version = "0.1", optional = true }
tailyew = { version = "0.1.57", optional = true }

[features]
default = []
wasm = [
    "dep:wasm-bindgen",
    "dep:web-sys",
    "dep:console_error_panic_hook",
    "yew",
    "yew-router",
    "gloo-net",
    "patternfly-yew",
    "rs-grid-yew",
    "rs-grid-core",
    "charming",
    "yew-hooks",
    "yew_icons",
    "hadrone-yew",
    "tailyew",
]
yew = ["dep:yew"]
yew-router = ["dep:yew-router"]
gloo-net = ["dep:gloo-net"]
patternfly-yew = ["dep:patternfly-yew"]
rs-grid-yew = ["dep:rs-grid-yew"]
rs-grid-core = ["dep:rs-grid-core"]
charming = ["dep:charming"]
yew-hooks = ["dep:yew-hooks"]
yew_icons = ["dep:yew_icons"]
hadrone-yew = ["dep:hadrone-yew"]
tailyew = ["dep:tailyew"]

[lib]
crate-type = ["cdylib", "rlib"]
