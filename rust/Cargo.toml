[workspace]
resolver = "2"
members = [
    "core/domain",
    "core/db",
    "core/workflow",
    "core/auth",
    "core/service",
    "forge",
    "server",
    "integrations",
    "cli",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

[workspace.dependencies]
axum = "0.8"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-native-roots",
    "postgres",
    "chrono",
    "derive",
    "json",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
uuid = { version = "1", features = ["v4", "serde"] }
